<style>
/* Layout: denah 3D penuh layar; HUD kiri atas, panel detail kanan, dock bawah. */
:root{
  --bg:#E4ECE6; --panel:rgba(250,252,250,.92); --line:#C3D1C8; --ink:#16302C; --muted:#5A716A;
  --gold:#A87B1C; --teal:#1E8C7A; --coral:#C2482F; --chip:#D9E4DD;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1F1D; --panel:rgba(14,32,30,.9); --line:#2C4F49; --ink:#E6EEE9; --muted:#8FA9A2;
  --gold:#D9AE4E; --teal:#5FC7B4; --coral:#E8775F; --chip:#21443F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1F1D; --panel:rgba(14,32,30,.9); --line:#2C4F49; --ink:#E6EEE9; --muted:#8FA9A2;
  --gold:#D9AE4E; --teal:#5FC7B4; --coral:#E8775F; --chip:#21443F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0}
#app canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:5;display:flex;flex-direction:column;gap:8px;max-width:min(560px,calc(100vw - 28px));pointer-events:none}
.hud>*{pointer-events:auto}
.title{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px)}
.title h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-family:var(--body);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px dashed var(--gold);color:var(--gold)}
.badge.live{border-style:solid;border-color:var(--teal);color:var(--teal)}
.title p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;backdrop-filter:blur(6px);min-width:70px}
.stat b{display:block;font-family:var(--display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:11.5px;color:var(--muted)}
.side{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:310px;z-index:5;display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(6px);min-width:0}
.card h2{font-family:var(--display);font-size:17px;margin:0 0 8px;font-weight:800}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.tagk{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 5px;vertical-align:middle;font-family:var(--body);font-weight:600}
.logc{flex:1;min-height:0;display:flex;flex-direction:column}
.log{list-style:none;margin:0;padding:0;overflow:auto;font-size:12.5px;flex:1}
.log li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42px 1fr;gap:8px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log li.err span{color:var(--coral)} .log li.ok strong{color:var(--teal)} .log li.amb span{color:var(--muted);font-style:italic}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.dock form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dock input[type=text]{flex:1 1 260px;min-width:0;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.btn{background:var(--gold);color:#1A1407;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.dock select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sr{position:absolute;left:-9999px}
.hint{flex-basis:100%;margin:0;font-size:11.5px;color:var(--muted)}
/* label di atas kepala */
.tag{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;font:600 11.5px/1 var(--body);color:#fff;background:rgba(22,40,38,.86);padding:4px 8px 4px 5px;border-radius:999px;white-space:nowrap;border:1.5px solid transparent;transform:translateY(-4px)}
.tag .ic{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:999px;background:rgba(255,255,255,.16);font-size:10.5px;padding:0 4px}
.tag.work .ic{background:#1E8C7A} .tag.think .ic{background:#A87B1C} .tag.err .ic{background:#C2482F}
.tag.sel{border-color:#F3C55B}
.tag .boss{background:#F3C55B;color:#2A1F05;border-radius:999px;padding:2px 6px;font-size:10px;letter-spacing:.04em}
.bub{pointer-events:none;font:600 12px/1.3 var(--body);color:#1F2A28;background:#fff;border-radius:12px;padding:6px 10px;max-width:220px;box-shadow:0 2px 10px rgba(0,0,0,.18);transform:translateY(-6px);text-align:center}
.bub.red{background:#FFE0D7} .bub.green{background:#DDF5EE} .bub.yel{background:#FFF4D6}
.plot{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px/1.2 var(--body);color:#fff;text-align:center}
.plot .plus{width:44px;height:44px;border-radius:50%;background:#F2A33A;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:0 3px 0 #B66F12}
.plot .pl{background:rgba(22,40,38,.86);padding:5px 10px;border-radius:999px}
.banner{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:7;background:rgba(16,40,34,.94);color:#F3E2B3;border:2px solid #D9AE4E;border-radius:14px;padding:10px 22px;font:800 22px var(--display)}
.paneltoggle{display:none}
/* lift menara */
.lift{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-30%);z-index:5;background:#0F1A22;border:1px solid #2C4A57;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;width:72px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lift .lt{font:700 10.5px/1.2 var(--body);color:#7FEFFF;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.lift button{background:#16252F;color:#BFEFF7;border:1px solid #2C4A57;border-radius:9px;padding:6px 0;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.lift button:hover{border-color:#5FE1FF}
.lift button[aria-pressed="true"]{background:#5FE1FF;color:#06222B;border-color:#5FE1FF;box-shadow:0 0 12px rgba(95,225,255,.55)}
.plot.job .plus{background:#1E8C7A;box-shadow:0 3px 0 #0F5A4E;font-size:22px}
.jobc ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}.jobc li{margin:2px 0}
.jobc .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.jobc .chips span{background:var(--chip);border-radius:999px;padding:2px 8px;font-size:11.5px}
.jobc h3{font:700 12px var(--body);color:var(--muted);margin:10px 0 0;text-transform:uppercase;letter-spacing:.05em}
.jobc .btn{margin-top:10px;width:100%}
.jobc .note{font-size:12px;color:var(--muted);margin:8px 0 0}
.flr ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}
#detail{max-height:62vh;overflow:auto}
.sec{font:700 11.5px var(--body);color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ctl button,.mini{background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 4px;font-size:12.5px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.mini{padding:4px 9px;font-size:12px}.mini[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1A1407}
.note2{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.trail{list-style:none;margin:0;padding:0;font-size:12px}.trail li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.trail time{color:var(--muted);font-variant-numeric:tabular-nums}.trail .bad{color:var(--coral)}
.lift button{position:relative}
.lift button[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:999px;background:#4CD07D;color:#06222B;font:800 10px/16px var(--body);text-align:center}
@media (max-width:860px){
  .side{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));max-height:42vh}
  .side.closed{display:none}
  .paneltoggle{display:inline-block}
  .title p{display:none}
  .stat{min-width:60px}
  .lift{top:auto;transform:none;bottom:calc(130px + env(safe-area-inset-bottom,0px));flex-direction:row;width:auto;align-items:center;padding:5px}
  .lift .lt{display:none} .lift button{padding:6px 9px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<header class="hud">
  <div class="title">
    <h1><span id="oname">Kantor AI</span> <span class="badge" id="mode">Menyambung…</span></h1>
    <p id="sub"><span id="otag"></span> Seret untuk memutar 360°, gulir untuk zoom, tombol Q/E memutar, T untuk tur, klik nama untuk detail.</p>
  </div>
  <div class="stats" aria-live="polite">
    <div class="stat"><b id="clock">--:--</b><span>Jam WIB</span></div>
    <div class="stat"><b id="sRuns">0</b><span>Run hari ini</span></div>
    <div class="stat"><b id="sAvg">-</b><span>Rata-rata</span></div>
    <div class="stat"><b id="sErr">0</b><span>Error</span></div>
    <div class="stat"><b id="sLast">-</b><span>Terakhir</span></div>
  </div>
</header>
<aside class="side" id="side">
  <section class="card" id="detail" aria-live="polite"></section>
  <section class="card logc"><h2>Catatan aktivitas</h2><ol class="log" id="log"></ol></section>
</aside>
<div class="banner" id="banner" hidden></div>
<nav class="lift" id="lift" aria-label="Lift menara">
  <div class="lt">Lift<br>Menara</div>
  <button type="button" data-f="5" aria-pressed="false">Atap</button>
  <button type="button" data-f="4" aria-pressed="false">L4</button>
  <button type="button" data-f="3" aria-pressed="false">L3</button>
  <button type="button" data-f="2" aria-pressed="false">L2</button>
  <button type="button" data-f="1" aria-pressed="false">L1</button>
  <button type="button" data-f="0" aria-pressed="true">Semua</button>
</nav>
<div class="dock">
  <form id="form" autocomplete="off">
    <label for="ask" class="sr">Tugas untuk agent</label>
    <input type="text" id="ask" maxlength="140" placeholder="Tulis tugas untuk tim agent">
    <button class="btn" type="submit" id="send">Kirim tugas</button>
    <button class="btn" type="button" id="replay" hidden>Putar ulang 24 jam</button>
    <select id="speed" aria-label="Kecepatan simulasi"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option></select>
    <button class="btn ghost" type="button" id="jump">Lompat ke waktu shalat</button>
    <button class="btn ghost" type="button" id="fault">Uji gangguan model</button>
    <button class="btn ghost" type="button" id="amb" aria-pressed="true">Suasana: aktif</button>
    <select id="view" aria-label="Sudut kamera"><option value="">Sudut kamera…</option><option value="depan">Depan</option><option value="kanan">Samping kanan</option><option value="belakang">Belakang</option><option value="kiri">Samping kiri</option><option value="atas">Dari atas</option><option value="menara">Menara</option><option value="darat">Mata pejalan</option></select>
    <button class="btn ghost" type="button" id="rotL" aria-label="Putar kamera ke kiri">⟲</button>
    <button class="btn ghost" type="button" id="tour" aria-pressed="false">Tur 360°</button>
    <button class="btn ghost" type="button" id="rotR" aria-label="Putar kamera ke kanan">⟳</button>
    <button class="btn ghost" type="button" id="cam">Reset kamera</button>
    <button class="btn ghost paneltoggle" type="button" id="ptog">Panel</button>
    <button class="btn ghost" type="button" id="theme">Tema</button>
    <p class="hint" id="hint"></p>
  </form>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

"]},{"id":"riset","nm":"Agent Riset","sh":"Riset","rl":"Riset dan membaca dokumen","slot":"pustaka","shirt":"#6D4C8C","hair":"short","glasses":true,"skin":"#DDAE86","tools":["pdf"],"k":["riset","jurnal","paper","referensi","literatur","tren"],"samples":["Riset tren AI minggu ini","Ringkas 3 jurnal terbaru"]},{"id":"ops","nm":"Agent Ops","sh":"Ops","rl":"Server, uptime, dan log","slot":"server","shirt":"#D9822B","hair":"short","skin":"#C99A73","tools":["exec"],"k":["server","vps","log","disk","ram","uptime"],"samples":["Cek RAM dan disk server","Periksa log error semalam"]},{"id":"pengingat","nm":"Agent Pengingat","sh":"Pengingat","rl":"Jadwal, pengingat, dan kajian","slot":"kajian","shirt":"#E9EEF0","hair":"pecip","skin":"#C99A73","tools":["web_fetch"],"cron":true,"k":["jadwal","pengingat","agenda","kajian","rapat"],"samples":["Cek agenda besok","Ingatkan jadwal rapat"]}],"jobs":[{"id":"desainer","nm":"Agent Desainer","sh":"Desainer","rl":"Desain konten visual","plot":"timur","roomSign":"Studio Kreatif","shirt":"#1E6E62","hair":"short","skin":"#D2A27C","glasses":true,"k":["desain","poster","banner","visual","thumbnail"],"covers":["Poster","Banner","Feed IG","Thumbnail","Slide","Logo"],"coverBrand":"STUDIO","duties":["Membuat draf poster dan banner","Menyiapkan feed media sosial","Menjaga konsistensi warna brand"],"skills":["desain visual","teliti","paham brand"],"samples":["Draf poster webinar","Thumbnail video minggu ini"]}],"candidates":[{"id":"sosmed","nm":"Agent Sosmed","rl":"Mengelola media sosial"}],"talks":[["Laporan pagi sudah beres?","Sudah, tinggal kirim","Mantap"],["Habis ini padel yuk","Boleh, yang kalah traktir kopi","Siapa takut"],["Konteksmu masih lega?","Masih, baru belasan persen","Hemat token, sip"],["Kamu pakai tool apa tadi?","pdf, baca jurnal","Rajin bener"],["Lanjut kerja?","Bentar, kopinya belum habis","Haha, oke"],["Sudah dzikir pagi?","Alhamdulillah sudah","Barakallahu fiik"],["Siapa jaga server malam ini?","Ops, seperti biasa","Semangat, Ops!"],["Kopi pantry makin enak ya","Biji baru katanya","Pantas ramai"]],"holoTalks":[["Tampilkan peta tugas 3D","Klaster merah itu tenggat minggu ini","Prioritaskan dulu"],["Proyeksi beban kerja bulan depan?","Grafiknya naik","Perlu agent baru nih"],["Zoom ke alur delegasi","Kepala ke Riset, lalu lapor balik","Alurnya rapi"],["Simulasikan gangguan provider","Model cadangan aktif","Bagus, tangguh"]]};
const CFG=Object.assign({},DEFAULT_CFG,window.KANTOR_CONFIG||await fetch('agents.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)||{});
const BOSS=CFG.agents.find(a=>a.boss)||CFG.agents[0];

const parseHM=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+(m||0);};

/* ================= grid & pathfinding ================= */
const CELL=.5,GX0=-21,GZ0=-15,NX=84,NZ=60,grid=new Uint8Array(NX*NZ);
const gx=x=>Math.floor((x-GX0)/CELL),gz=z=>Math.floor((z-GZ0)/CELL),wx=i=>GX0+(i+.5)*CELL,wz=j=>GZ0+(j+.5)*CELL;
function blockRect(x0,z0,x1,z1){for(let i=Math.max(0,gx(x0));i<=Math.min(NX-1,gx(x1-1e-6));i++)for(let j=Math.max(0,gz(z0));j<=Math.min(NZ-1,gz(z1-1e-6));j++)grid[j*NX+i]=1;}
const free=(i,j)=>i>=0&&j>=0&&i<NX&&j<NZ&&!grid[j*NX+i];
function nearestFree(i,j){if(free(i,j))return[i,j];for(let r=1;r<24;r++)for(let di=-r;di<=r;di++)for(let dj=-r;dj<=r;dj++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;if(free(i+di,j+dj))return[i+di,j+dj];}return[i,j];}
function los(a,b){const d=Math.hypot(b.x-a.x,b.z-a.z),n=Math.ceil(d/.2);for(let s=1;s<n;s++){const x=a.x+(b.x-a.x)*s/n,z=a.z+(b.z-a.z)*s/n;if(!free(gx(x),gz(z))||!free(gx(x+.22),gz(z))||!free(gx(x-.22),gz(z))||!free(gx(x),gz(z+.22))||!free(gx(x),gz(z-.22)))return false;}return true;}
function astar(x0,z0,x1,z1){
  const [si,sj]=nearestFree(gx(x0),gz(z0)),[ti,tj]=nearestFree(gx(x1),gz(z1)),N=NX*NZ;
  const g=new Float32Array(N).fill(Infinity),came=new Int32Array(N).fill(-1),closed=new Uint8Array(N),heap=[];
  const push=(f,n)=>{heap.push([f,n]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  const h=(i,j)=>{const dx=Math.abs(i-ti),dz=Math.abs(j-tj);return dx+dz-.586*Math.min(dx,dz);};
  const s=sj*NX+si,t=tj*NX+ti;g[s]=0;push(h(si,sj),s);
  while(heap.length){const n=pop()[1];if(closed[n])continue;closed[n]=1;if(n===t)break;const i=n%NX,j=(n/NX)|0;
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;const ni=i+di,nj=j+dj;if(!free(ni,nj))continue;if(di&&dj&&(!free(i+di,j)||!free(i,j+dj)))continue;
      const m=nj*NX+ni,ng=g[n]+(di&&dj?1.414:1);if(ng<g[m]){g[m]=ng;came[m]=n;push(ng+h(ni,nj),m);}}}
  if(t!==s&&came[t]<0)return[{x:x1,z:z1}];
  const cells=[];for(let n=t;n!==-1;n=came[n]){cells.push(n);if(n===s)break;}cells.reverse();
  const pts=cells.map(n=>({x:wx(n%NX),z:wz((n/NX)|0)}));pts[0]={x:x0,z:z0};
  const out=[];let k=0;while(k<pts.length-1){let far=k+1;for(let m=pts.length-1;m>k+1;m--){if(los(pts[k],pts[m])){far=m;break;}}out.push(pts[far]);k=far;}
  out.push({x:x1,z:z1});return out;
}

  if(s.done){bubble(a,'Saya shalat menyusul',1800);await run(a,[pause(5000,'Shalat menyusul')]);return;}
  a.cup=false;a.anim=null;await run(a,go(a,sp,a===M?'Menuju musholla, jadi imam':'Menuju musholla'));a.inPrayer=true;a.arrived=true;a.act=(a===M?'Imam':'Makmum')+' shalat '+s.name;
  if(a===M){await until(()=>ACT.every(x=>x.arrived||x===M),60000);bubble(M,'Allahu akbar',1600);s.started=true;}
  await until(()=>s.done);a.inPrayer=false;a.arrived=false;bubble(a,a===M?"Assalaamu'alaikum warahmatullah":'Aamiin',1800);
  await run(a,[pause(1400,'Dzikir sejenak'),goL(a.home,'Kembali ke meja')]);},10);}

/* ================= mode simulasi ================= */
let simSeq=0;
function route(text){const t=text.toLowerCase();let best=M,sc=0;AG.forEach(a=>{if(!a.k)return;let s=0;a.k.forEach(w=>{if(t.includes(w))s+=w.length;});if(s>sc){sc=s;best=a;}});return best;}
async function simRun(agent,kind,text){const id='sim-'+(++simSeq),start=nowMs();const base={runId:id,agent:agent.id,kind,model:'gpt-4.1-mini',start,tools:[],sent:kind!=='subagent',error:false,status:'success'};
  if(text)log(`${esc(CFG.owner)} meminta: ${esc(text)}`);
  onEvent({phase:'start',run:base});await sleep(1500);onEvent({phase:'prompt',run:base});
  const d=4000+Math.random()*7000;await sleep(d);
  const fail=S.fault&&agent!==M;if(fail){S.fault=false;fault.textContent='Uji gangguan model';}
  const tools=agent.tools||(agent===M?['message']:['read']);
  const end=Object.assign({},base,{end:nowMs(),durMs:Math.round(1500+d),tools:fail?[]:tools,error:fail,status:fail?'404':'success'});
  onEvent({phase:'artifacts',run:end});onEvent({phase:'end',run:end});}
function simTask(text){const T=route(text);simRun(T,T===M?'telegram':'subagent',text);}
let nextAuto=3500;
function simTick(dt){nextAuto-=dt;if(nextAuto<=0&&!(S.salat&&!S.salat.done)){nextAuto=12000+Math.random()*12000;const a=pick(AG),l=SAMPLES[a.id]||['Cek tugas rutin'];simTask(pick(l));}
  const day=Math.floor(minOf()/1440),mod=minOf()%1440;
  if(mod>=420&&S.daily!==day){S.daily=day;log(`Jadwal 07.00 WIB memicu <strong>${esc(CFG.dailyLabel||'laporan harian')}</strong>`);simRun(M,'cron');}
  const slot=Math.floor((minOf()-60)/360);if(S.hsiSlot===-1)S.hsiSlot=slot;else if(slot!==S.hsiSlot){S.hsiSlot=slot;const cr=AG.filter(a=>a.cron);if(cr.length)simRun(pick(cr),'cron');}}

/* ================= mode live ================= */
const modeEl=document.getElementById('mode');
function setLive(ok){modeEl.textContent=ok?'Live':'Terputus';modeEl.className='badge'+(ok?' live':'');}
function connectLive(){const es=new EventSource('api/events');
  es.addEventListener('hello',e=>{const st=JSON.parse(e.data);setLive(true);
    [...new Set([...st.history,...st.running].map(r=>r.agent))].forEach(id=>ensureAgent(id,true));
    if(!S.hist.length){S.hist=st.history.slice();logEl.innerHTML='';st.history.slice(-25).forEach(r=>{const a=A[r.agent];if(a)log(`<strong>${a.nm}</strong> ${r.error?'gagal':'selesai'}: ${KIND[r.kind]||esc(r.kind)}, ${dur(r.durMs)}`,r.error?'err':'ok',r.end);});
      log('Tersambung ke gateway. Riwayat 48 jam dimuat');}
    st.running.forEach(r=>{onEvent({phase:'start',run:r});if(r.phase!=='start')onEvent({phase:'prompt',run:r});});stats();});
  es.addEventListener('run',e=>onEvent(JSON.parse(e.data),false));es.onerror=()=>setLive(false);}
async function detect(){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);const r=await fetch('api/state',{cache:'no-store',signal:c.signal});clearTimeout(t);
  if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j.history))throw 0;return true;}catch{return false;}}
detect().then(live=>{S.live=live;S.ready=true;
  if(live){S.speed=1;['send','ask','speed','jump','fault'].forEach(id=>document.getElementById(id).hidden=true);replay.hidden=false;
    document.getElementById('hint').textContent=`Data live dari gateway agent. Feed hanya membawa nama agent, jenis sesi, waktu, durasi, model, nama tool, dan status. Ngopi, padel, gym${CFG.shalat?', dan shalat':''} adalah suasana.`;
    connectLive();}
  else{modeEl.textContent='Simulasi';S.simMs=Date.now();if(minOf()%1440>=420)S.daily=Math.floor(minOf()/1440);S.hsiSlot=Math.floor((minOf()-60)/360);log('Kantor dibuka (mode simulasi)');(CFG.firstTasks||[]).slice(0,3).forEach((t,i)=>setTimeout(()=>simTask(t),900+i*1700));}
  stats();});

/* ================= loop ================= */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const skyDay=new THREE.Color('#BFE3F2'),skyEve=new THREE.Color('#F2B98C'),skyNight=new THREE.Color('#0F1B30');
function lighting(){const m=minOf()%1440;let day;if(m<300||m>=1170)day=0;else if(m<390)day=(m-300)/90;else if(m>=1050)day=1-(m-1050)/120;else day=1;
  const eve=(m>=990&&m<1170)||(m>=300&&m<420);const sky=skyNight.clone().lerp(eve?skyEve:skyDay,day);scene.background.copy(sky);scene.fog.color.copy(sky);
  sun.intensity=.15+1.45*day;hemi.intensity=.25+.65*day;const ang=(m/1440)*Math.PI*2-Math.PI/2;sun.position.set(Math.cos(ang)*40,30+20*day,25);
  const night=1-day;roomLights.forEach(l=>l.intensity=night*14);towerLights.forEach(l=>l.intensity=4+night*12);lamp.intensity=night*6+2;gymLight.intensity=night*6;bulbMat.emissiveIntensity=.25+night*2.2;}
let last=performance.now(),detT=0,statT=0,ledT=0;
function frame(now){const real=Math.min(100,now-last);last=now;const dt=S.paused?0:real*S.speed;
  if(!S.live)S.simMs+=dt*120; // 1 detik nyata = 2 menit kantor (x kecepatan)
  ACT.forEach(a=>{step(a,dt);if(a.bub){a.bub.ms-=dt;if(a.bub.ms<=0){a.bub=null;a.P.bubD.hidden=true;}}});
  for(const w of [...waiters]){w.e+=dt;if(w.pred()||w.e>=w.max){waiters.delete(w);w.res();}}
  const day=Math.floor(minOf()/1440),mod=minOf()%1440;
  if(S.ambient)PRAYERS.forEach(([n,tm])=>{const key=day+n;if(mod>=tm&&mod<tm+(S.live?3:30)&&!S.prayed[key]){S.prayed[key]=1;startPrayer(n);}});
  if(S.salat&&S.salat.started&&!S.salat.done){S.salat.e+=dt;if(S.salat.e>=16000){S.salat.done=true;log(`Shalat <strong>${S.salat.name}</strong> berjamaah selesai`,'amb');}}
  if(S.ready&&!S.live&&!S.paused)simTick(dt);
  ambTick(dt);
  if(S.ballFlight){const b=S.ballFlight;b.t+=dt/850;const k=Math.min(1,b.t);ball.visible=true;ball.position.lerpVectors(b.a,b.b,k);ball.position.y=Y0+1.2+Math.sin(Math.PI*k)*1.6;}else ball.visible=false;
  ACT.forEach(a=>{pose(a,now);updTag(a);const hid=!!TV.cut&&(a.floor||0)>TV.cut;a.P.root.visible=!hid;a.P.tagO.visible=!hid;a.P.bubO.visible=!hid;});
  growTick(real);
  {const sa=A[S.sel];selRing.visible=!!sa&&sa.P.root.visible;if(sa){selRing.position.set(sa.x,Y0+floorY(sa.floor||0)+.04,sa.z);const k=1+.08*Math.sin(now/250);selRing.scale.set(k,k,k);}
   if(S.follow&&sa&&!camTw){const f=sa.floor||0;if(f>0&&f<5&&TV.cut!==f)setCut(f);else if(f===0&&TV.cut)setCut(0);
     const p=_v3.set(sa.x,Y0+floorY(f)+.9,sa.z),d=p.clone().sub(controls.target).multiplyScalar(.12);controls.target.add(d);camera.position.add(d);}}
  liftT+=real;if(liftT>500){liftT=0;liftBtns.forEach(b=>{const k=+b.dataset.f;b.dataset.n=k>=1&&k<=4?ACT.filter(a=>(a.floor||0)===k).length:0;});}
  const ts=now/1000;
  PADS.forEach(p=>{p.flash=Math.max(0,p.flash-real/700);p.col.material.opacity=p.flash*.8;p.glow.material.opacity=.25+.15*Math.sin(ts*3)+p.flash*.5;p.ring.rotation.z=ts*.8;});
  {const wk=ACT.filter(a=>a.working||a.thinking).length,sp=1.6+.7*wk,amp=.45+.12*wk;qMat.emissiveIntensity=.7+.12*wk+amp*Math.sin(ts*sp);qMat2.emissiveIntensity=.7+.12*wk+amp*Math.sin(ts*sp+2);}
  globe.rotation.y=ts*.6;globe.rotation.x=Math.sin(ts*.3)*.3;core.scale.setScalar(1+.08*Math.sin(ts*3));holo.position.y=Y0+floorY(3)+1.75+Math.sin(ts*1.2)*.06;
  bars.forEach((b,i)=>{const h=.25+1.2*HB[i]+.06*Math.sin(ts*1.3+i*1.7);b.scale.y=h;b.position.y=-.2+h/2;});
  LIFT.wait-=real;if(LIFT.wait<=0&&Math.abs(LIFT.y-LIFT.target)<.01){LIFT.target=floorY(1+Math.floor(Math.random()*5));LIFT.wait=3000+Math.random()*3000;}
  LIFT.y+=Math.sign(LIFT.target-LIFT.y)*Math.min(Math.abs(LIFT.target-LIFT.y),real*.0022);cap.position.y=Y0+LIFT.y;cap.visible=!TV.cut||LIFT.y<=floorY(TV.cut)+.1;
  {const cyc=ts%60;let x,y,z;const roofPad=new THREE.Vector3(-2,TOWER_TOP+.35,-26);
   if(cyc<40){const an=ts*.35;x=Math.cos(an)*13;z=-26+Math.sin(an)*10;y=TOWER_TOP+3.5+Math.sin(ts*1.7)*.4;}
   else if(cyc<48){const k=(cyc-40)/8,an=40*.35+Math.floor(ts/60)*60*.35;const sx=Math.cos(an)*13,sz=-26+Math.sin(an)*10;x=sx+(roofPad.x-sx)*k;z=sz+(roofPad.z-sz)*k;y=TOWER_TOP+3.5+(roofPad.y-TOWER_TOP-3.5)*k;}
   else if(cyc<54){x=roofPad.x;z=roofPad.z;y=roofPad.y;}
   else{const k=(cyc-54)/6;x=roofPad.x;z=roofPad.z;y=roofPad.y+k*3.2;}
   drone.position.set(x,y,z);drone.rotation.y=-ts*.35;const spin=cyc>=48&&cyc<54?.2:1;rotors.forEach((r,i)=>r.rotation.y+=real*.06*spin*(i%2?1:-1));droneLed.visible=Math.floor(ts*2)%2===0;}
  beacon.visible=Math.floor(ts*1.5)%2===0;
  ledT+=real;if(ledT>350){ledT=0;leds.forEach(l=>{l.material=Math.random()<.25?ledOff:ledOn;});}
  document.getElementById('clock').textContent=hhmm(minOf());
  lighting();
  if(camTw){const k=Math.min(1,(performance.now()-camTw.st)/camTw.ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(camTw.t0,camTw.t1,e);const a=camTw.s0,b=camTw.s1;
    _sph.set(a.radius+(b.radius-a.radius)*e,a.phi+(b.phi-a.phi)*e,a.theta+camTw.dth*e);
    camera.position.copy(controls.target).add(_v3.setFromSpherical(_sph));if(k>=1)camTw=null;}
  if(camGoal){controls.target.lerp(camGoal,.08);if(controls.target.distanceTo(camGoal)<.05)camGoal=null;}
  controls.update();renderer.render(scene,camera);labelR.render(scene,camera);
  detT+=real;if(detT>300){detT=0;renderDetail();}statT+=real;if(statT>5000){statT=0;stats();}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ================= kontrol ================= */
const $=id=>document.getElementById(id);
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('ask').value.trim();if(!v||S.live)return;simTask(v);$('ask').value='';});
$('speed').addEventListener('change',e=>S.speed=+e.target.value);
const fault=$('fault');fault.addEventListener('click',()=>{S.fault=!S.fault;fault.textContent=S.fault?'Gangguan disiapkan':'Uji gangguan model';});
$('jump').addEventListener('click',()=>{const mod=minOf()%1440,p=nextPrayer(),add=((p[1]-1-mod)+1440)%1440;S.simMs+=add*60000;S.hsiSlot=Math.floor((minOf()-60)/360);S.daily=Math.floor(minOf()/1440);log(`Jam diloncatkan ke menjelang ${p[0]}`);});
const ab=$('amb');ab.addEventListener('click',()=>{S.ambient=!S.ambient;ab.textContent='Suasana: '+(S.ambient?'aktif':'mati');ab.setAttribute('aria-pressed',S.ambient);});
$('cam').addEventListener('click',()=>{$('view').value='';S.follow=false;setCut(0);if(innerWidth<860)flyTo(new THREE.Vector3(0,62,70),new THREE.Vector3(0,3,-6));else flyTo(HOME_CAM,HOME_T);});
$('view').addEventListener('change',e=>{const v=VIEWS[e.target.value];if(v){S.follow=false;setCut(0);flyTo(v[0],v[1],1800);}});
document.querySelectorAll('#lift button').forEach(b=>b.addEventListener('click',()=>towerView(+b.dataset.f)));
function followFly(){const a=A[S.sel];if(!a)return;const f=a.floor||0;if(f>0&&f<5)setCut(f);else setCut(0);const y=Y0+floorY(f);flyTo(V(a.x+4.2,y+3.4,a.z+5.2),V(a.x,y+.9,a.z),1200);}
detail.addEventListener('click',e=>{const cb=e.target.closest('[data-cmd]');if(cb&&A[S.sel]){command(A[S.sel],cb.dataset.cmd);lastDetail='';renderDetail();return;}
  const fb2=e.target.closest('[data-follow]');if(fb2){S.follow=!S.follow;if(S.follow)followFly();else setCut(0);lastDetail='';renderDetail();return;}const b=e.target.closest('[data-hire]');if(b&&!S.live&&JOB[b.dataset.hire])hire(JOB[b.dataset.hire]);});
$('tour').addEventListener('click',()=>controls.autoRotate?tourOff():tourOn());
$('rotL').addEventListener('click',()=>rotBy(Math.PI/4));$('rotR').addEventListener('click',()=>rotBy(-Math.PI/4));
controls.addEventListener('start',()=>{camTw=null;tourOff();$('view').value='';});
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))return;
  if(e.key==='q'||e.key==='Q')rotBy(Math.PI/4);else if(e.key==='e'||e.key==='E')rotBy(-Math.PI/4);else if(e.key==='t'||e.key==='T')controls.autoRotate?tourOff():tourOn();});
$('ptog').addEventListener('click',()=>$('side').classList.toggle('closed'));
if(innerWidth<860)$('side').classList.add('closed');
$('theme').addEventListener('click',()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=cur==='light'?'dark':'light';});
const replay=$('replay');
replay.addEventListener('click',async()=>{if(S.replaying)return;const since=Date.now()-86400e3,list=S.hist.filter(r=>r.start>=since&&A[r.agent]);
  if(!list.length){log('Belum ada aktivitas 24 jam terakhir untuk diputar ulang');return;}S.replaying=true;log(`Putar ulang ${list.length} run dari 24 jam terakhir`);
  for(const r of list){const f=Object.assign({},r,{runId:'rp-'+r.runId});onEvent({phase:'start',run:f},true);await sleep(1500);onEvent({phase:'prompt',run:f},true);
    await sleep(Math.min(6000,Math.max(2500,(r.durMs||4000)/3)));onEvent({phase:'artifacts',run:f},true);onEvent({phase:'end',run:f},true);await sleep(2500);}
  S.replaying=false;log('Putar ulang selesai');});
// klik karakter di kanvas
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let downAt=null;
app.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
app.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;const r=renderer.domElement.getBoundingClientRect();
  mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);const hit=ray.intersectObjects(ACT.map(a=>a.P.root),true)[0];if(hit&&hit.object.userData.agent)select(hit.object.userData.agent);});
renderDetail();drawDash();
</script>
