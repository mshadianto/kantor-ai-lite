<style>
:root{--ink:#F4F6FA;--muted:#A3AABB;--panel:rgba(6,10,18,.84);--line:rgba(255,255,255,.14);
  --disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:400 14px/1.5 var(--body);overflow:hidden;color-scheme:dark}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#app>canvas{display:block;width:100%!important;height:100%!important}
.labs{position:absolute;inset:0}
.panel{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hud{position:fixed;top:14px;left:14px;right:350px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.ttl{display:flex;align-items:center;gap:14px;padding:10px 16px;align-self:flex-start}
.logo{font:700 14px/1 var(--disp);text-decoration:none;border:2px solid #fff;border-radius:999px;padding:5px 11px;white-space:nowrap}
.ttl h1{font:700 26px/1 var(--disp);margin:0;letter-spacing:-.01em;white-space:nowrap}
.ttl h1 em{font-style:normal;background:linear-gradient(90deg,#7aa2ff,#c38bff 50%,#5fe9e9);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font:600 11px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;padding:5px 8px;border:1px solid #ffd36b;color:#ffd36b;white-space:nowrap}
.badge.live{border-color:#4fe39a;color:#4fe39a}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start}
.st{padding:7px 13px;min-width:92px}
.st b{display:block;font:700 21px/1.05 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.st span{font:500 10px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rooms{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start}
.rb{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font:600 11.5px/1 var(--disp);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
.rb::before{content:'';flex:none;width:8px;height:8px;background:var(--tc,#fff);transform:rotate(45deg)}
.rb:hover{border-color:var(--tc,#fff)}
.rb[aria-pressed="true"]{background:var(--tc,#fff);color:var(--on,#000);border-color:var(--tc,#fff)}
.rb[aria-pressed="true"]::before{background:currentColor}
.rb .n{min-width:12px;font-variant-numeric:tabular-nums;opacity:.75}
.side{position:fixed;top:14px;right:14px;bottom:76px;width:322px;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.side h2{font:600 11px/1 var(--disp);letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0;padding:14px 14px 8px}
#crew{display:flex;flex-direction:column;padding:0 8px 6px;max-height:48%;overflow:auto;flex:none}
.crew{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:1px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);padding:7px 6px;cursor:pointer}
.crew:hover{background:rgba(255,255,255,.06)}
.crew i{width:9px;height:9px;border-radius:50%;background:var(--d);box-shadow:0 0 8px var(--d)}
.crew b{font:600 13.5px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .cr{font:600 10px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--tc);white-space:nowrap}
.crew .ca{grid-column:2/4;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logw{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
#log{list-style:none;margin:0;padding:0 14px 12px;overflow:auto;flex:1}
#log li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px;color:#D3D8E2}
#log time{color:var(--muted);font-variant-numeric:tabular-nums}
#log li.err span{color:#ff9aa5}#log li.ok span b{color:#8ff0bf}#log li.amb span{color:#ecd99e}#log li.del span{color:#c7b8ff}
.dock{position:fixed;left:14px;right:350px;bottom:14px;z-index:6;display:flex;gap:8px}
.dock form{flex:1;display:flex;min-width:0}
.dock input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);padding:0 14px;height:46px}
.dock input::placeholder{color:#8a92a3}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font:600 11.5px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#fff}
.btn.pri{background:#1A5CFF;border-color:#1A5CFF}
.btn.gold{border-color:#e9c46a;color:#f3d98a}

.card{position:fixed;left:14px;bottom:72px;z-index:6;width:min(380px,calc(100vw - 28px));padding:14px 18px 14px;border-color:var(--tc)}
.card .k{font:600 10.5px var(--disp);letter-spacing:.24em;text-transform:uppercase;color:var(--tc)}
.card h3{font:700 26px/1.05 var(--disp);margin:6px 30px 6px 0}
.card p{margin:0 0 10px;color:#C9CED9;font-size:13px}
.card .who{display:flex;flex-wrap:wrap;gap:6px}
.card .who span{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px 3px 7px;border:1px solid var(--line);border-radius:999px}
.card .who i{width:7px;height:7px;border-radius:50%;background:var(--d)}
.card .who .e{border:0;color:var(--muted);padding:0}
.card .x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:24px;line-height:1;cursor:pointer;padding:4px}
.rlab{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:8px;font:600 12px/1 var(--disp);letter-spacing:.15em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.62);border:1.5px solid var(--tc);padding:7px 10px;white-space:nowrap}
.rlab b{color:var(--tc)}
.rlab .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.rlab.busy{box-shadow:0 0 14px var(--tc)}
.rlab.pray{border-color:#e9c46a;box-shadow:0 0 20px #e9c46a}
.rlab:hover{background:var(--tc);color:#000}.rlab:hover b,.rlab:hover .cnt{color:#000}
.tag{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 5px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28);font:600 11px/1.4 var(--body);color:#fff;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--d,#8f98aa);box-shadow:0 0 6px var(--d,#8f98aa)}
.tag.sel{border-color:#fff;box-shadow:0 0 14px #fff}
body.far .tag b{display:none}body.far .tag{padding:3px}
.bub{pointer-events:none;background:#fff;color:#0b0f17;font:600 11.5px/1.3 var(--body);padding:4px 9px;border-radius:10px 10px 10px 2px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.bub.green{background:#8ff0bf}.bub.red{background:#ff9aa5}.bub.gold{background:#f3d98a}
#banner{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9;padding:12px 22px;font:700 17px/1.2 var(--disp);letter-spacing:.04em;border:1.5px solid #e9c46a;color:#f3e2b3;background:rgba(10,8,2,.88);box-shadow:0 0 30px rgba(233,196,106,.35);max-width:calc(100vw - 28px);text-align:center}
@media (max-width:1180px){.st.opt{display:none}}
@media (max-width:860px){
  .hud{right:10px;top:10px;left:10px}.ttl{padding:8px 12px;gap:10px}.ttl h1{font-size:19px}.logo{display:none}
  .st{min-width:0;padding:5px 9px}.st b{font-size:16px}.st span{font-size:9px;letter-spacing:.1em}
  .rooms{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}.rb{padding:7px 9px}
  .side{top:auto;left:0;right:0;bottom:0;width:auto;height:58vh;transform:translateY(102%);transition:transform .3s;z-index:8}
  body.sheet .side{transform:none}
  .dock{right:10px;left:10px;bottom:10px;flex-wrap:wrap}.dock form{flex-basis:100%}.btn{height:40px;padding:0 12px;flex:1;justify-content:center}.dock input{height:42px}
  #ptog{display:inline-flex}.card{bottom:118px;left:10px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>

<div id="app" role="img" aria-label="Stasiun Ribath: delapan kapsul kru AI agent dalam satu tampilan 3D"></div>
<div class="hud">
  <div class="ttl panel"><a class="logo" href="index.html">‹ diwan</a><h1>Stasiun <em>Ribath</em></h1><span class="badge" id="mode">Menyambung…</span></div>
  <div class="stats">

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================= konfigurasi: sama dengan index.html (agents.json bila ada) ================= */
const DEFAULT_CFG={name:'Kantor AI',menu:['Kopi susu','Teh tarik','Kurma','Air mineral'],
 prayers:[['Subuh','04:35'],['Dzuhur','11:55'],['Ashar','15:15'],['Maghrib','17:55'],['Isya','19:05']],
 agents:[
  {id:'kepala',nm:'Agent Kepala',sh:'Kepala',rl:'Orkestrator, membagi tugas ke tim',shirt:'#2F4A6B',hair:'peci',skin:'#C99A73',samples:['Status singkat tim hari ini?','Susun rencana kerja minggu ini']},
  {id:'penulis',nm:'Agent Penulis',sh:'Penulis',rl:'Menulis artikel, caption, dan email',shirt:'#8C3B3B',hair:'short',skin:'#D9A983',samples:['Tulis caption LinkedIn soal AI','Draf email penawaran']},
  {id:'analis',nm:'Agent Analis',sh:'Analis',rl:'Mengolah data dan laporan',shirt:'#3E7A57',hair:'hijab',hijab:'#2D8C84',skin:'#E0B48F',samples:['Rangkum penjualan bulan ini','Bandingkan KPI kuartal lalu']},
  {id:'coder',nm:'Agent Coder',sh:'Coder',rl:'Coding, debug, dan otomasi',shirt:'#5B6470',hair:'messy',skin:'#C08C66',samples:['Perbaiki bug form login','Tulis skrip backup']},
  {id:'cs',nm:'Agent CS',sh:'CS',rl:'Menjawab pertanyaan pelanggan',shirt:'#B5653A',hair:'hijab',hijab:'#C9B08A',skin:'#DDAE86',samples:['Jawab 5 tiket pelanggan terbaru','Perbarui FAQ produk']},
  {id:'riset',nm:'Agent Riset',sh:'Riset',rl:'Riset dan membaca dokumen',shirt:'#6D4C8C',hair:'short',glasses:true,skin:'#DDAE86',samples:['Riset tren AI minggu ini','Ringkas 3 jurnal terbaru']},
  {id:'ops',nm:'Agent Ops',sh:'Ops',rl:'Server, uptime, dan log',shirt:'#D9822B',hair:'short',skin:'#C99A73',samples:['Cek RAM dan disk server','Periksa log error semalam']},
  {id:'pengingat',nm:'Agent Pengingat',sh:'Pengingat',rl:'Jadwal, pengingat, dan kajian',shirt:'#E9EEF0',hair:'pecip',skin:'#C99A73',samples:['Cek agenda besok','Ingatkan jadwal rapat']}],
 jobs:[{id:'desainer',nm:'Agent Desainer',sh:'Desainer',rl:'Desain konten visual',shirt:'#1E6E62',hair:'short',skin:'#D2A27C',glasses:true,samples:['Draf poster webinar','Thumbnail video minggu ini']}]};
let CFG=DEFAULT_CFG;
try{const j=window.KANTOR_CONFIG||await fetch('agents.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);if(j)CFG=Object.assign({},DEFAULT_CFG,j);}catch(e){}
const ALL=[...(CFG.agents||[]),...(CFG.jobs||[])];
const AG=id=>ALL.find(a=>a.id===id);
const nm=id=>(AG(id)||{}).nm||id;
const COARSE=matchMedia('(pointer: coarse)').matches,SMALL=innerWidth<860,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);}catch(e){}

/* ================= waktu WIB & shalat ================= */
const hm=s=>{const[a,b]=String(s).split(':').map(Number);return a*60+(b||0);};
function wibNow(){const d=new Date();return((d.getUTCHours()+7)%24)*60+d.getUTCMinutes()+d.getUTCSeconds()/60;}
function prayerState(){const n=wibNow(),P=(CFG.prayers||[]).map(([k,t])=>[k,t,hm(t)]);let cur=null;for(const p of P)if(n>=p[2]&&n<p[2]+15)cur=p;
  const nx=P.find(p=>p[2]>n)||P[0];return{cur,nx,n};}
const fmt=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(Math.floor(m%60)).padStart(2,'0')}`;
const SEQ=[['qiyam',5],['ruku',2.6],['itidal',1.6],['sujud',2.6],['duduk',1.8],['sujud',2.6]],SEQT=SEQ.reduce((s,p)=>s+p[1],0);
function seqPose(t){let m=((t%SEQT)+SEQT)%SEQT;for(const[p,d]of SEQ){if(m<d)return p;m-=d;}return'qiyam';}

/* ================= bahan, warna, tekstur ================= */
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const hx=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const rgba=(h,a)=>`rgba(${hx(h).join(',')},${a})`;
const look=(x,z,tx,tz)=>Math.atan2(tx-x,tz-z);
function prng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const MC={},EM={},TX={};
function M(col,o={}){const k=col+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:.6,metalness:.1},o)));}
function emis(col,k=2){const key=col+'|'+k;return EM[key]||(EM[key]=new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k)}));}
function addMesh(par,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;par.add(m);return m;}
function B(par,w,h,d,mat,x,y,z,ry=0){const m=addMesh(par,new THREE.BoxGeometry(w,h,d),mat,x,y+h/2,z);m.rotation.y=ry;return m;}
function C(par,rt,rb,h,mat,x,y,z,seg=20){return addMesh(par,new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y+h/2,z);}
function canvasTex(w,h,draw,key){if(key&&TX[key])return TX[key];const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;if(key)TX[key]=t;return t;}

/* garis cahaya pelangi yang mengalir, ciri khas tepi kapsul */
const GLOWTX=[],GM={};
function glowMat(rep=2){if(GM[rep])return GM[rep];
  const t=canvasTex(512,8,(x,w,h)=>{const g=x.createLinearGradient(0,0,w,0);
    ['#ff6ad5','#c774e8','#8f8cff','#55c8ff','#6dffe0','#ffe28a','#ff9f6a','#ff6ad5'].forEach((s,i,a)=>g.addColorStop(i/(a.length-1),s));x.fillStyle=g;x.fillRect(0,0,w,h);});
  t.wrapS=THREE.RepeatWrapping;t.repeat.set(rep,1);GLOWTX.push(t);
  return GM[rep]=new THREE.MeshBasicMaterial({map:t,color:new THREE.Color(3.4,3.4,3.4)});}
function glowPath(pts,closed=false,r=.07,rep=2){const cp=new THREE.CurvePath(),n=pts.length;
  for(let i=0;i<(closed?n:n-1);i++)cp.add(new THREE.LineCurve3(pts[i],pts[(i+1)%n]));
  return new THREE.Mesh(new THREE.TubeGeometry(cp,Math.max(24,n*14),r,8,closed),glowMat(rep));}

function floorTex(rx,ry,col='#cfd3da'){const t=canvasTex(256,256,(x,w,h)=>{x.fillStyle=col;x.fillRect(0,0,w,h);x.strokeStyle='rgba(0,0,0,.16)';x.lineWidth=3;x.strokeRect(1.5,1.5,w-3,h-3);
    x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.strokeRect(10,10,w-20,h-20);x.fillStyle='rgba(0,0,0,.06)';x.fillRect(w/2-40,h/2-2,80,4);},'floor'+rx+ry+col);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}

/* layar UI prosedural untuk dinding dan meja */
function uiTex(kind,tc){
  const st=kind==='prayer'?prayerState():null,key='ui'+kind+tc+(st?(st.cur?st.cur[0]:st.nx?.[0]):'');
  return canvasTex(512,320,(x,W,H)=>{let seed=0;for(const ch of key)seed=seed*31+ch.charCodeAt(0)|0;const R=prng(seed);
    x.fillStyle='#030a15';x.fillRect(0,0,W,H);
    if(kind==='poster'){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b2b3a');g.addColorStop(1,tc);x.fillStyle=g;x.fillRect(0,0,W,H);
      x.fillStyle='#ffe7a3';x.beginPath();x.arc(W*.72,H*.36,74,0,7);x.fill();x.fillStyle='#0d3443';x.beginPath();x.arc(W*.72+30,H*.36-16,66,0,7);x.fill();
      x.font='700 54px "Chakra Petch",sans-serif';x.fillStyle='#fff';x.fillText('WEBINAR',30,H-96);x.font='600 30px "Chakra Petch",sans-serif';x.fillText('GRC & AI · AMANAH',30,H-50);return;}
    if(kind==='doc'){x.fillStyle='#f4f6fa';x.fillRect(0,0,W,H);x.fillStyle=tc;x.fillRect(0,0,W,34);x.fillStyle='rgba(30,40,60,.5)';for(let i=0;i<10;i++)x.fillRect(30,60+i*24,(i%4===3?200:440)*(.7+R()*.3),9);return;}
    x.strokeStyle=rgba(tc,.12);x.lineWidth=1;for(let i=0;i<=W;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}for(let j=0;j<=H;j+=32){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke();}

  }

    const rg=new THREE.Mesh(new THREE.TorusGeometry(.9,.05,8,48),glowMat(1));rg.rotation.y=Math.PI/2;rg.position.copy(wm.position);g.add(rg);}
  const dx=L/2-.37,door=new THREE.Mesh(new THREE.PlaneGeometry(1.25,2.2),M('#9aa3b1',{metalness:.5,roughness:.3}));door.rotation.y=-Math.PI/2;door.position.set(dx,1.1,-1.0);g.add(door);

function slab(g,HULL){

/* ================= agent: ruang kerja, titik singgah, jalan & teleport antarkapsul ================= */
const AGENTS={};
const BOSS_ID=((CFG.agents||[]).find(a=>a.boss)||(CFG.agents||[])[0]||{}).id;
const WORK0={kepala:'komando',pengingat:'jadwal',analis:'lab',riset:'pustaka',coder:'bengkel',ops:'server',cs:'studio',penulis:'studio',desainer:'studio'};
function workRoom(a){const k=a.room||WORK0[a.id];if(k)return ALIAS[k]||(ROOM[k]?k:'1.1');if(a.id===BOSS_ID)return'1.1';
  const s=((a.rl||'')+' '+(a.k||[]).join(' ')).toLowerCase();
  if(/data|analis|laporan|angka|grafik/.test(s))return'2.1';if(/riset|jurnal|dokumen|literatur|paper/.test(s))return'2.2';
  if(/kode|coding|debug|script|api|deploy/.test(s))return'3.1';if(/server|log|uptime|ops|disk/.test(s))return'3.2';
  if(/jadwal|pengingat|agenda|kajian/.test(s))return'1.2';if(/desain|tulis|pelanggan|konten|chat|sosmed/.test(s))return'4.1';return'1.1';}
const worldOf=s=>{const g=ROOM[s.room].g.position;return{x:g.x+s.x,z:g.z+s.z};};
const isDesk=s=>s.pose==='type'||s.pose==='read';
const stKey=ag=>ag.tp?'move':ag.mode==='pray'?'pray':ag.state;
function release(ag){const s=ag.spot;if(!s)return;if(s.occ===ag.id)s.occ=null;
  if(s.temp){const r=ROOM[s.room],i=r.spots.indexOf(s);if(i>=0)r.spots.splice(i,1);}ag.spot=null;}
function pickSpot(ag,key,mode){const r=ROOM[key],free=r.spots.filter(s=>!s.occ),mine=free.filter(s=>s.id===ag.id),open=s=>!s.id||!AGENTS[s.id];
  let s;
  if(mode==='idle')s=(key===workRoom(ag.a)&&mine[0])||mine.find(x=>!isDesk(x))||free.find(x=>!isDesk(x)&&open(x))||free.find(x=>!isDesk(x))||mine[0]||free.find(open);
  else s=mine.find(isDesk)||mine[0]||free.find(x=>isDesk(x)&&open(x))||free.find(open)||free.find(isDesk);
  if(!s){s={room:key,id:null,x:-3.2+Math.random()*6.4,z:.3+Math.random()*1.4,ry:(Math.random()-.5)*.8,pose:'stand',opt:{},occ:null,temp:true};r.spots.push(s);}
  return s;}
function moveTo(ag,key,mode,act,spot){const s=spot||pickSpot(ag,key,mode),old=ag.spot,had=!!(ag.room&&old);
  const same=had&&ag.room===key&&!ag.tp,ox=old?old.x:0,oz=old?old.z:0;
  release(ag);s.occ=ag.id;ag.spot=s;ag.mode=mode;if(act)ag.act=act;
  if(ag.tp||!had){ag.room=key;return;}
  if(same){if(old===s)return;const d=Math.hypot(s.x-ox,s.z-oz);ag.walk={x0:ox,z0:oz,k:0,sp:1.5/Math.max(.4,d),face:Math.atan2(s.x-ox,s.z-oz)};return;}
  ag.walk=null;ag.tp={k:0,a:{x:ag.o.P.position.x,z:ag.o.P.position.z}};ag.room=key;}
function poseFor(ag){const s=ag.spot,sa=S.salat;
  if(ag.mode==='pray')return!sa?'stand':sa.phase==='pray'?'pray':(sa.phase==='salam'||sa.phase==='dzikir')?'duduk':'stand';
  if(ag.mode==='work')return s.pose;
  if(ag.mode==='think')return isDesk(s)?'read':(s.pose==='sofa'||s.pose==='duduk')?s.pose:'stand';
  return isDesk(s)?'sit':(s.pose==='gesture'||s.pose==='point')?'stand':s.pose;}
function ensureAgent(id){if(AGENTS[id])return AGENTS[id];
  const a=AG(id)||{id,nm:'Agent '+id,sh:id,rl:'Agent baru',shirt:'#4d5a6c',skin:'#C99A73',hair:'short'};
  const o=makePerson(a,{headset:id==='cs'});scene.add(o.P);
  const tag=document.createElement('button');tag.type='button';tag.className='tag';tag.innerHTML=`<i></i><b>${esc(a.sh||a.nm)}</b>`;
  tag.addEventListener('pointerdown',e=>e.stopPropagation());tag.addEventListener('click',()=>selectAgent(id));
  const to=new CSS2DObject(tag);to.position.set(0,2.05,0);o.P.add(to);
  const bub=document.createElement('div');bub.className='bub';bub.hidden=true;const bo=new CSS2DObject(bub);bo.position.set(0,2.62,0);o.P.add(bo);
  const col=new THREE.Color(a.shirt||'#8ab').lerp(new THREE.Color('#ffffff'),.45);
  const orb=new THREE.Group();orb.visible=false;scene.add(orb);const om=[];
  for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(i?Math.max(.04,.14-.012*i):.22,12,10),new THREE.MeshBasicMaterial({color:col.clone().multiplyScalar(i?2:3.4),transparent:true,opacity:i?1-i/10:1,depthWrite:false}));orb.add(m);om.push(m);}
  const ag={id,a,o,tag,bub,orb,om,trail:[],col,state:'idle',mode:'idle',room:null,spot:null,act:'Siaga',run:null,bubT:0,
    nextWander:performance.now()+9000+Math.random()*16000};
  AGENTS[id]=ag;const k=workRoom(a);moveTo(ag,k,'idle','Siaga di '+ROOM[k].def.name);return ag;}
function bubble(ag,text,ms=1900,cls=''){ag.bub.textContent=text;ag.bub.className='bub'+(cls?' '+cls:'');ag.bub.hidden=false;ag.bubT=performance.now()+ms;}
function selectAgent(id){const ag=AGENTS[id];if(!ag)return;focusRoom(ag.room);ag.tag.classList.add('sel');setTimeout(()=>ag.tag.classList.remove('sel'),2600);bubble(ag,ag.act,2400);}

/* efek: pilar cahaya teleport, busur delegasi */
const BEAMS=[],ARCS=[];
function beam(x,z,col){const m=new THREE.Mesh(new THREE.CylinderGeometry(.45,.6,2.6,24,1,true),new THREE.MeshBasicMaterial({color:col.clone().multiplyScalar(1.7),transparent:true,opacity:.85,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));
  m.position.set(x,1.3,z);scene.add(m);const r=new THREE.Mesh(new THREE.TorusGeometry(.55,.045,8,32),new THREE.MeshBasicMaterial({color:col.clone().multiplyScalar(2.6),transparent:true,depthWrite:false}));
  r.rotation.x=Math.PI/2;r.position.set(x,.05,z);scene.add(r);BEAMS.push({m,r,k:0});}
function arc(a,b,col){const A=new THREE.Vector3(a.x,1.6,a.z),Bv=new THREE.Vector3(b.x,1.6,b.z),mid=A.clone().add(Bv).multiplyScalar(.5);mid.y=6+A.distanceTo(Bv)*.2;
  const cur=new THREE.QuadraticBezierCurve3(A,mid,Bv);
  const m=new THREE.Mesh(new THREE.TubeGeometry(cur,48,.07,6,false),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(2.4),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),new THREE.MeshBasicMaterial({color:new THREE.Color(3,3,3)}));scene.add(m,dot);ARCS.push({m,dot,cur,k:0});}
function fx(dt){for(let i=BEAMS.length-1;i>=0;i--){const b=BEAMS[i];b.k+=dt/.8;b.m.material.opacity=.85*Math.max(0,1-b.k);b.m.scale.set(1+b.k*.4,1,1+b.k*.4);b.r.scale.setScalar(1+b.k*1.6);b.r.material.opacity=Math.max(0,1-b.k);
    if(b.k>=1){scene.remove(b.m,b.r);b.m.geometry.dispose();b.r.geometry.dispose();b.m.material.dispose();b.r.material.dispose();BEAMS.splice(i,1);}}
  for(let i=ARCS.length-1;i>=0;i--){const a=ARCS[i];a.k+=dt/2.4;const k=a.k;a.m.material.opacity=.9*(k<.12?k/.12:k>.7?Math.max(0,(1-k)/.3):1);
    a.dot.visible=k<.62;if(a.dot.visible)a.dot.position.copy(a.cur.getPoint(Math.min(1,k/.6)));
    if(k>=1){scene.remove(a.m,a.dot);a.m.geometry.dispose();a.m.material.dispose();ARCS.splice(i,1);}}}
function agUpdate(ag,t,dt,now){const o=ag.o,P=o.P;
  if(!ag.bub.hidden&&now>ag.bubT)ag.bub.hidden=true;
  if(ag.tp){const T=ag.tp,b=worldOf(ag.spot);T.k+=dt;
    if(T.k<.35){P.visible=true;P.position.set(T.a.x,0,T.a.z);if(!T.ba){T.ba=1;beam(T.a.x,T.a.z,ag.col);}const s=1-T.k/.35;P.scale.set(.5+.5*s,Math.max(.02,s),.5+.5*s);}
    else if(T.k<1.45){P.visible=false;const u=(T.k-.35)/1.1,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      if(!T.cur){const A=new THREE.Vector3(T.a.x,1.1,T.a.z),Bv=new THREE.Vector3(b.x,1.1,b.z),mid=A.clone().add(Bv).multiplyScalar(.5);mid.y=4.5+A.distanceTo(Bv)*.17;T.cur=new THREE.QuadraticBezierCurve3(A,mid,Bv);}
      T.cur.v2.set(b.x,1.1,b.z);ag.trail.unshift(T.cur.getPoint(e));if(ag.trail.length>9)ag.trail.pop();
      ag.orb.visible=true;ag.om.forEach((m,i)=>m.position.copy(ag.trail[Math.min(i,ag.trail.length-1)]));}
    else{ag.orb.visible=false;ag.trail.length=0;P.visible=true;P.position.set(b.x,0,b.z);P.rotation.y=ag.spot.ry;
      if(!T.bb){T.bb=1;beam(b.x,b.z,ag.col);}const s=Math.min(1,(T.k-1.45)/.35);P.scale.set(.5+.5*s,Math.max(.02,s),.5+.5*s);
      if(T.k>=1.8){P.scale.set(1,1,1);ag.tp=null;}}
    o.pose=poseFor(ag);o.update(t,dt,false);return;}
  const g=ROOM[ag.room].g.position;
  if(ag.walk){const w=ag.walk,s=ag.spot;w.k=Math.min(1,w.k+dt*w.sp);
    P.position.set(g.x+w.x0+(s.x-w.x0)*w.k,Math.abs(Math.sin(t*9))*.03,g.z+w.z0+(s.z-w.z0)*w.k);P.rotation.y=w.face;o.pose='stand';o.update(t,dt,true);
    if(w.k>=1)ag.walk=null;return;}
  P.position.set(g.x+ag.spot.x,0,g.z+ag.spot.z);P.rotation.y=ag.spot.ry;o.pose=poseFor(ag);o.update(t,dt,false);}

/* ================= aktivitas: kontrak data sama dengan Kantor 3D (api/state + api/events) ================= */
const RUNS={},praying=()=>!!(S.salat&&!S.salat.done);
function log(html,cls,ts){const ul=$('log'),li=document.createElement('li');if(cls)li.className=cls;
  li.innerHTML=`<time>${wibHM(ts||Date.now())}</time><span>${html}</span>`;ul.prepend(li);while(ul.children.length>90)ul.lastChild.remove();}
function stats(){const k=dayOf(Date.now());S.runs=S.runs.filter(r=>dayOf(r.end||r.start||0)===k);const d=S.runs.filter(x=>x.durMs);
  $('sRun').textContent=S.runs.length;$('sAvg').textContent=d.length?dur(d.reduce((s,x)=>s+x.durMs,0)/d.length):'-';$('sErr').textContent=S.runs.filter(x=>x.error).length;}
function onRun(phase,run){if(!run||!run.agent)return;const ag=ensureAgent(run.agent),id=run.runId||(run.agent+':'+run.start),
  k=KIND[run.kind]||run.kind||'tugas',key=workRoom(ag.a),rn=ROOM[key].def.name,pr=praying();
  if(phase==='start'){if(RUNS[id])return;RUNS[id]=run;ag.run=run;ag.state='think';
    if(run.kind==='subagent'&&AGENTS[BOSS_ID]&&run.agent!==BOSS_ID){const b=AGENTS[BOSS_ID].o.P.position;arc({x:b.x,z:b.z},{x:ROOM[key].cx,z:ROOM[key].cz},ag.a.shirt||'#8ab');}
    if(!pr)moveTo(ag,key,'think','Membaca '+k);else ag.act='Membaca '+k+' selepas shalat';

    bubble(ag,run.kind==='cron'?'Jadwal rutin, bismillah':'Bismillah, mulai',1800,'green');}
  else if(phase==='prompt'){ag.state='work';if(!pr){ag.act='Bekerja: '+k;if(ag.room!==key)moveTo(ag,key,'work');else ag.mode='work';}}
  else if(phase==='artifacts'){if(run.tools&&run.tools.length){ag.act='Memakai '+run.tools.join(', ');bubble(ag,'🔧 '+run.tools.join(', '),1600);}}
  else if(phase==='end'){delete RUNS[id];ag.run=null;ag.state='idle';if(!pr){ag.mode='idle';ag.act=run.error?'Run gagal, menunggu':'Selesai, '+dur(run.durMs);}ag.nextWander=performance.now()+6000+Math.random()*9000;
    S.runs.push(run);stats();
    log(`<b>${esc(ag.a.nm)}</b> ${run.error?'gagal':'selesai'}: ${esc(k)}, ${dur(run.durMs)}${run.tools&&run.tools.length?' · '+esc(run.tools.join(', ')):''}`,run.error?'err':'ok',run.end);
    bubble(ag,run.error?'Gagal, dicoba lagi nanti':'Selesai ✓',2000,run.error?'red':'green');}}

function route(text){const t=text.toLowerCase();let best=BOSS_ID,sc=0;ALL.forEach(a=>{if(!a.k)return;let s=0;a.k.forEach(w=>{if(t.includes(w))s+=w.length;});if(s>sc){sc=s;best=a.id;}});return best;}

  const run={runId:'sim-'+(++simSeq),agent:id,kind,model:CFG.simModel||'gpt-4.1-mini',start:Date.now(),tools:[],error:false,status:'success'};

function prayerTick(t,dt){const s=S.salat;if(!s||s.done)return;s.e+=dt;const ags=Object.values(AGENTS),boss=AGENTS[BOSS_ID];

      (st.history||[]).slice(-20).forEach(r=>log(`<b>${esc(nm(r.agent))}</b> ${r.error?'gagal':'selesai'}: ${esc(KIND[r.kind]||r.kind)}, ${dur(r.durMs)}`,r.error?'err':'ok',r.end));
      log('Tersambung ke gateway agent. Riwayat dimuat','amb');}
    (st.running||[]).forEach(r=>{onRun('start',r);if(r.phase&&r.phase!=='start')onRun('prompt',r);});});
  es.addEventListener('run',e=>{const d=JSON.parse(e.data);onRun(d.phase,d.run);});es.onerror=()=>setMode(false,true);}
async function detect(){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500);const r=await fetch('api/state',{cache:'no-store',signal:c.signal});clearTimeout(tm);
  if(!r.ok)return false;const j=await r.json();return Array.isArray(j.history);}catch(e){return false;}}

/* ================= antarmuka ================= */
const nav=$('rooms'),crewEl=$('crew');
nav.innerHTML=`<button class="rb" type="button" data-k="" style="--tc:#ffffff;--on:#000">Semua kapsul</button>`+
  ROOMS.map(r=>`<button class="rb" type="button" data-k="${r.key}" style="--tc:${r.t.c};--on:${r.t.on}" title="Terminal ${r.t.n}: ${esc(r.t.title)}">${esc(r.def.name.replace(/^Ruang /,''))}<span class="n" data-n="${r.key}"></span></button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('.rb');if(b)b.dataset.k?focusRoom(b.dataset.k):overview();});
function updRoomBtns(){nav.querySelectorAll('.rb').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.k||null)===S.focus)));}
function renderCard(){const c=$('card');if(!S.focus){c.hidden=true;c.dataset.h='';return;}const r=ROOM[S.focus],t=r.t;
  const who=Object.values(AGENTS).filter(a=>a.room===S.focus&&!a.tp);
  const html=`<button class="x" type="button" aria-label="Kembali ke semua kapsul">×</button><div class="k">Terminal ${String(t.n).padStart(2,'0')} · ${esc(t.title)}</div><h3>${esc(r.def.name)}</h3><p>${esc(r.def.p)}</p><div class="who">${
    who.length?who.map(a=>`<span style="--d:${STCOL[stKey(a)]}"><i></i>${esc(a.a.sh||a.a.nm)} · ${esc(a.act)}</span>`).join(''):'<span class="e">Kapsul ini sedang kosong</span>'}</div>`;
  if(c.dataset.h!==html){c.innerHTML=html;c.dataset.h=html;c.querySelector('.x').onclick=()=>overview();}c.style.setProperty('--tc',t.c);c.hidden=false;}
function renderCrew(){const html=Object.values(AGENTS).map(ag=>{const k=stKey(ag),r=ROOM[ag.room];
    return`<button class="crew" type="button" data-id="${esc(ag.id)}" style="--d:${STCOL[k]};--tc:${r?r.t.c:'#fff'}"><i></i><b>${esc(ag.a.nm)}</b><span class="cr">${r?esc(r.def.name.replace(/^Ruang /,'')):''}</span><span class="ca">${esc(STLBL[k])} · ${esc(ag.act)}</span></button>`;}).join('');
  if(crewEl.dataset.h!==html){crewEl.innerHTML=html;crewEl.dataset.h=html;}}
crewEl.addEventListener('click',e=>{const b=e.target.closest('.crew');if(!b)return;selectAgent(b.dataset.id);if(innerWidth<860)document.body.classList.remove('sheet');});
function uiTick(){const ags=Object.values(AGENTS);
  for(const r of ROOMS){const inR=ags.filter(a=>a.room===r.key&&!a.tp),wk=inR.filter(a=>a.state==='work'&&a.mode!=='pray').length;
    const txt=inR.length?(wk?`${inR.length} · ${wk} kerja`:String(inR.length)):'';if(r.cnt.textContent!==txt)r.cnt.textContent=txt;
    r.lab.classList.toggle('busy',wk>0);const n=nav.querySelector(`[data-n="${r.key}"]`);if(n)n.textContent=inR.length||'';r.lightT=6+wk*5;}
  $('sAct').textContent=ags.filter(a=>a.state==='work').length;
  for(const ag of ags){const k=stKey(ag);if(ag._k!==k){ag._k=k;ag.tag.style.setProperty('--d',STCOL[k]);}ag.tag.title=`${ag.a.nm}: ${ag.act}`;}
  renderCrew();if(S.focus)renderCard();}
function clockTick(){$('clock').textContent=fmt(wibNow());const st=prayerState();
  $('sNext').textContent=st.cur?st.cur[0]:st.nx?st.nx[1]:'-';$('sNextL').textContent=st.cur?'Waktu shalat':st.nx?st.nx[0]+' berikutnya':'Shalat';
  if(st.cur){const key=dayOf(Date.now())+st.cur[0];if(!S.prayed[key]){S.prayed[key]=1;startPrayer(st.cur[0],false);}}}
$('pray').addEventListener('click',()=>{const st=prayerState();startPrayer(st.cur?st.cur[0]:st.nx?st.nx[0]:'berjamaah',true);});
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('ask').value.trim();if(!v||S.live)return;simTask(v);$('ask').value='';});
$('ptog').addEventListener('click',()=>document.body.classList.toggle('sheet'));
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
  if(e.key==='Escape'||e.key==='0')overview();else if(/^[1-8]$/.test(e.key))focusRoom(ROOMS[+e.key-1].key);});
addEventListener('resize',()=>layout());

/* ================= mulai ================= */
ALL.forEach(a=>ensureAgent(a.id));
layout();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  for(const tx of GLOWTX)tx.offset.x=(tx.offset.x+dt*.06)%1;
  for(const r of ROOMS){for(const f of r.c.ticks)f(t,dt);r.light.intensity+=(r.lightT-r.light.intensity)*Math.min(1,dt*2);}
  for(const ag of Object.values(AGENTS))agUpdate(ag,t,dt,now);
  fx(dt);prayerTick(t,dt);
  if(tw){const k=Math.min(1,(now-tw.st)/tw.ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(k>=1)tw=null;}
  controls.update();const far=camera.position.distanceTo(controls.target)>150;if(far!==S.far){S.far=far;document.body.classList.toggle('far',far);}
  comp.render(dt);labelR.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
setInterval(uiTick,400);uiTick();setInterval(clockTick,1000);clockTick();
setInterval(()=>{const n=performance.now();if(!S.live)simTick(n);wanderTick(n);},1000);
detect().then(live=>{S.live=live;
  if(live){setMode(true);$('form').hidden=true;connectLive();}
  else{setMode(false);nextSim=performance.now()+6000;nextCron=performance.now()+45000;
    log('Stasiun dibuka (mode simulasi). Di server, halaman ini membaca gateway agent yang sama dengan Kantor 3D','amb');
    (CFG.firstTasks||[]).slice(0,3).forEach((x,i)=>setTimeout(()=>simTask(x),900+i*1600));}});
</script>
